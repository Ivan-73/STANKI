<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Справочник парка оборудования</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f4f7f6;
            padding: 40px 20px;
            color: #333;
            margin: 0;
        }

        h1 {
            color: #1ece74;
            font-size: 1.6rem;
            margin-bottom: 24px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-width: 720px;
        }

        li { margin: 10px 0; }

        a {
            display: block;
            padding: 15px 20px;
            background: #ffffff;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        a:hover {
            background: #e6f7ec;
            color: #1ece74;
            transform: translateX(5px);
        }

        @media (max-width: 480px) {
            body { padding: 20px 12px; }
            h1 { font-size: 1.3rem; }
        }
    </style>
</head>
